<section class="request-list" aria-labelledby="requests-heading">
    <h1 id="requests-heading">Solicitudes</h1>
    <div class="filters">
        <mat-form-field appearance="outline">
            <mat-label>Buscar solicitudes</mat-label>
            <input matInput type="search" [value]="list.search()" (input)="onSearch($event)" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Estado</mat-label>
            <mat-select [value]="list.status()" (valueChange)="onStatus($event)">
                <mat-option value="">Todos</mat-option>
                <mat-option value="pending">Pendiente</mat-option>
                <mat-option value="approved">Aprobada</mat-option>
                <mat-option value="rejected">Rechazada</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Tipo</mat-label>
            <mat-select [value]="list.type()" (valueChange)="onType($event)">
                <mat-option value="">Todos</mat-option>
                <mat-option value="equipment">Equipo</mat-option>
                <mat-option value="access">Acceso</mat-option>
                <mat-option value="travel">Viaje</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <lib-data-table [data]="list.items()" [columns]="columns" [loading]="list.loading()" [error]="list.error()" (retry)="list.retry()" />
    @if (!list.error()) {
        <mat-paginator [length]="list.totalCount() ?? 0" [pageIndex]="list.page() - 1" [pageSize]="list.limit()" [pageSizeOptions]="[10, 25, 50]" (page)="onPage($event)" aria-label="Páginas de solicitudes" />
    }
</section>
